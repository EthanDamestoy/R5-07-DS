name: Q5
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Créer le fichier
        run: |
          {
            echo "Ethan DAMESTOY"
            cat Q5.java
          } > "Q5_archive_$(date +%d-%m-%Y).txt"
      - name: Commit et push
        run: |
          git config --global user.name  "EthanDamestoy"
          git config --global user.email "ethan.damestoy@etu.univ-lehavre.fr"
          git add -A
          git diff --cached --quiet || git commit -m "Q5"
          git pull --rebase
          git push
