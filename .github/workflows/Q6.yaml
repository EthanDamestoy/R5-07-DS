name: Q6
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Créer le fichier
        run: |
          D=$(date +%d-%m-%Y-%H%M%S)
          NEW="Q6_archive_$D.txt"
          PREV=$(ls Q6_archive_*.txt 2>/dev/null | awk -F'[-_.]' '{print $5 $4 $3 $6, $0}' | sort | tail -1 | cut -d' ' -f2)
          {
            echo "Ethan DAMESTOY"
            cat Q6.java
            echo "Caractères : $(wc -m < Q6.java)"
            echo "Lignes : $(wc -l < Q6.java)"
          } > "$NEW"
          if [ -n "$PREV" ]; then
            diff "$PREV" "$NEW" > "Q6_différences.txt" || true
          else
            echo "Aucune archive précédente" > "Q6_différences.txt"
          fi
      - name: Commit et push
        run: |
          git config --global user.name  "EthanDamestoy"
          git config --global user.email "ethan.damestoy@etu.univ-lehavre.fr"
          git add -A
          git diff --cached --quiet || git commit -m "Q6"
          git pull --rebase
          git push
